[project]
name = "pharmabox"
version = "0.1.0"
description = "Scanner man-in-the-middle box for pharmacy inventory/expiry capture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pi = ["evdev>=1.6"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
