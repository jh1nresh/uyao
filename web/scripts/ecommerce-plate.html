<!doctype html>
<!--
  電商產品圖版型 —— 由 scripts/build-ecommerce-images.py 逐張截圖成 1000×1000 PNG。

  版面來自 Claude Design 專案「電商產品圖製作」的 電商產品圖.dc.html。這裡把
  design-doc 的 <x-dc> 外殼與 support.js runtime 拿掉，只留可靜態算繪的內容，
  並改用站上同一份 Noto Sans TC 子集字型 —— 不依賴 Google Fonts，離線也能算繪，
  而且不會因為抓不到字型而默默 fallback 成別的字。

  每個 .screen 是一張 1000×1000 的成品圖，`data-name` 就是輸出檔名。
-->
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Noto Sans TC";
    src: url("../app/fonts/noto-sans-tc-var.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    font-family: "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 逐張截圖，所以每張各自置頂排列，彼此不影響版位 */
  .screen {
    width: 1000px; height: 1000px;
    background: #ffffff;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .bar { height: 12px; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 34px 56px 0; }
  .eyebrow { font-size: 23px; font-weight: 700; letter-spacing: 3px; }
  .eyebrow-r { font-size: 22px; font-weight: 500; color: #8a8f99; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 26px 56px 10px; }
  .stage-in { border-radius: 24px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .foot { padding: 6px 56px 46px; display: flex; flex-direction: column; gap: 14px; }
  .title { font-size: 50px; font-weight: 900; color: #20262e; line-height: 1.15; }
  .title sup { font-size: 26px; vertical-align: super; }
  .subtitle { font-size: 21px; font-weight: 700; letter-spacing: 2.5px; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .chip { padding: 10px 20px; border-radius: 999px; font-size: 22px; font-weight: 700; }

  .sec-head { display: flex; align-items: center; gap: 18px; padding: 52px 56px 0; }
  .sec-rule { width: 8px; height: 40px; border-radius: 4px; }
  .sec-title { font-size: 40px; font-weight: 900; color: #20262e; }
  .sec-tag { font-size: 20px; font-weight: 700; letter-spacing: 3px; color: #b3bac2; margin-left: auto; }

  .usp { flex: 1; display: flex; gap: 44px; padding: 38px 56px 52px; align-items: center; }
  .usp-art { align-self: stretch; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; }
  .usp-art img { max-height: 100%; max-width: 100%; }
  .usp-list { flex: 1; display: flex; flex-direction: column; gap: 30px; }
  .usp-row { display: flex; gap: 20px; align-items: flex-start; }
  .usp-num { width: 52px; height: 52px; border-radius: 50%; color: #fff; font-size: 25px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .usp-h { font-size: 28px; font-weight: 800; color: #20262e; }
  .usp-p { font-size: 22px; color: #5a616b; line-height: 1.55; margin-top: 4px; }

  .ing { flex: 1; display: flex; gap: 44px; padding: 30px 56px 26px; }
  .ing-list { flex: 1; display: flex; flex-direction: column; }
  .ing-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid #ecedef; }
  .ing-row:last-child { border-bottom: 0; }
  .ing-k { font-size: 24px; font-weight: 600; color: #333a43; }
  .ing-v { font-size: 24px; font-weight: 800; }
  .ing-v.plain { font-size: 21px; font-weight: 500; color: #7a828c; }
  .ing-side { width: 360px; display: flex; flex-direction: column; gap: 22px; }
  .ing-art { border-radius: 18px; display: flex; align-items: center; justify-content: center; padding: 18px; flex: 1; overflow: hidden; }
  .ing-art img { max-height: 330px; max-width: 100%; border-radius: 8px; }
  .ing-note { border-radius: 18px; padding: 26px 28px; }
  .ing-note-h { font-size: 24px; font-weight: 800; }
  .ing-note-p { font-size: 22px; line-height: 1.6; margin-top: 8px; }
  .disclaimer { background: #f4f5f6; padding: 20px 56px; font-size: 19px; color: #7a828c; line-height: 1.55; }

  /* 缺素材時不要靜默出一張空白圖 —— 明顯標出來，避免誤上架 */
  .missing {
    width: 100%; height: 100%; min-height: 260px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: repeating-linear-gradient(45deg, #fbe9e7, #fbe9e7 12px, #f6ded9 12px, #f6ded9 24px);
    border: 2px dashed #bd2f28; border-radius: 12px;
    color: #8c231e; font-size: 20px; font-weight: 700; line-height: 1.5; padding: 20px;
  }
</style>
<body>__SCREENS__</body>
